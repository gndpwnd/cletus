<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to Markdown/PDF Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Report Generator</h1>
        
        <div class="upload-section">
            <h2>Upload JSON or Markdown Files</h2>
            <input type="file" id="fileInput" multiple accept=".json,.md">
            <div class="button-group">
                <button id="mergeButton">Merge and Download JSON</button>
                <button id="reportButton">Generate Report (Markdown)</button>
            </div>
        </div>

        <div id="fileListContainer" class="file-list"></div>

        <div id="markdown-container" class="markdown-output">
            <h3>Generated Report</h3>
            <div class="markdown-content">
                <pre id="markdown-output"></pre>
                <div class="markdown-buttons">
                    <button id="copy-button">Copy</button>
                    <button id="download-button">Download</button>
                    <button id="pdf-button">PDF</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
