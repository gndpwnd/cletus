baseURL = "https://gndpwnd.github.io/cletus/"
languageCode = "en-us"
defaultContentLanguage = "en"
title = "Cletus's Blog"
theme = "anubis2"
disqusShortname = ""

[pagination]
pagerSize = 5

[params.author]
name = "Cletus"
location = "Your Mom's House"

[params]
description = "Cletus's attempt at analyzing some information"
dateFormat = "2006-01-02"
paginationSinglePost = true

# Deprecated params (moved to params.anubis2)
readMore = false
readNextPosts = 2
rssAsSocialIcon = true
locale = "en-us"
toc = true

# Graphcomment support (deprecated, moved to params.anubis2)
graphcommentId = ""

# New params.anubis2 section (replaces deprecated params)
[params.anubis2]
enableColorThemeSwitcher = true  # Replaces params.colorThemeSwitcher
colorTheme = "auto"             # Replaces params.colorTheme
enableCopyCodeButton = true      # Replaces params.copyCodeButton
enableMathGlobally = false       # Replaces params.math
customCSS = ["custom-css/custom1.scss", "custom-css/custom2.css"]  # Replaces params.customCSS

# Social links (new format)
# Social links (correct format for Anubis2)
[[params.anubis2.social]]
id = "github"  # must match the icon names the theme supports
url = "https://github.com/00psfreebooks/cletus"
title = "GitHub"  # optional accessibility title

# Replace with the correct format (check theme docs):
[params.giscus]
enable = true
repo = "Junyi-99/hugo-theme-anubis2"
repoId = "R_kgDOLEp76Q"
category = "General"
categoryId = "DIC_kwDOLEp76c4CcbPS"

[[menu.main]]
identifier = "home"
name = "Home"
url = "/"
weight = 1

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 2

[[menu.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 3

[[menu.main]]
identifier = "archive"
name = "Archive"
url = "/posts/"
weight = 4

[[menu.main]]
identifier = "data"
name = "Data"
url = "/data_analysis/"
weight = 5

[languages]
[languages.en]
languageName = "English"

[taxonomies]
category = "categories"
tag = "tags"
author = "authors"

[markup]
defaultMarkdownHandler = 'goldmark'

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
anchorLineNos = false
codeFences = true
noClasses = true
style = 'catppuccin-frappe'
tabWidth = 4

[params.umamiAnalytics]
enabled = true
dnt = false
id = "d01ce82c-c8f4-4714-ba37-ba4899f2a885"
datacache = false
url = "https://umami.xtra.science/script.js"
shareUrl = "https://umami.xtra.science/share/Fy0goUn0b9rrxxGe/hugo-theme-anubis2.netlify.app"

[params.googleAnalytics]
enabled = true
gtag = "G-32F16X8HLF"