{% extends "base.html" %}

{% block title %}Articles - Cletus News Aggregator{% endblock %}
{% block nav_articles %}active{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Articles</h1>
        <button onclick="loadArticles()" class="btn btn-secondary">Refresh All</button>
    </div>

    <!-- Filters -->
    <div class="filters-section">
        <div class="filter-group">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Search headlines... (updates as you type)" 
                class="filter-input"
            >
        </div>
        
        <div class="filter-group">
            <button onclick="clearFilters()" class="btn btn-secondary">Clear Search</button>
        </div>
    </div>

    <!-- Articles List -->
    <div class="content-section">
        <div id="articles-list" class="articles-container">
            <p class="text-muted">Loading articles...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', path='js/articles.js') }}"></script>
{% endblock %}
