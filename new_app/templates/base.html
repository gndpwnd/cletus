<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cletus News Aggregator{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/main.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <h1>Cletus News Aggregator</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="/" class="nav-link {% block nav_dashboard %}{% endblock %}">Dashboard</a></li>
                <li><a href="/articles" class="nav-link {% block nav_articles %}{% endblock %}">Articles</a></li>
                <li><a href="/scraper" class="nav-link {% block nav_scraper %}{% endblock %}">Scraper</a></li>
                <li><a href="/blacklist" class="nav-link {% block nav_blacklist %}{% endblock %}">Blacklist</a></li>
                <li><a href="/analysis" class="nav-link {% block nav_analysis %}{% endblock %}">Analysis</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Notification Toast -->
    <div id="notification" class="notification"></div>

    <!-- Base Scripts -->
    <script src="{{ url_for('static', path='js/utils.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
